name: wakfu-coach

services:
  wakfu-coach:
    build:
      context: .
      dockerfile: Dockerfile
    image: wakfu-coach:latest
    container_name: wakfu-coach
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistencia de SQLite en el host (./data/wakfu.db)
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/wakfu.db
      # Siembra el dataset de muestra la primera vez que la base está vacía
      AUTO_SEED: "true"
      # --- LLM local opcional (Ollama). Descomenta si tienes un contenedor Ollama ---
      # OLLAMA_URL: http://host.docker.internal:11434
      # OLLAMA_MODEL: llama3.2:3b
      # --- LLM con VISIÓN (p.ej. deepseek-v4-flash-vision-exp).
      # Para visión con DeepSeek usa el endpoint Anthropic-compatible:
      #   LLM_BASE_URL=https://api.deepseek.com/anthropic  (se autodetecta el formato).
      # La API key va SOLO en el archivo .env del host (compose lo lee automáticamente).
      # Vacíos = modo extractivo sin LLM. ---
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Modelo de CONVERSACIÓN/coach (fuerte): deepseek-chat
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # Modelo de VISIÓN (solo para leer capturas): el 'vision-exp'
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-deepseek-v4-flash-vision-exp}
      LLM_API_STYLE: ${LLM_API_STYLE:-auto}
      LLM_IMAGE_API: ${LLM_IMAGE_API:-auto}
      LLM_MAX_IMAGES: ${LLM_MAX_IMAGES:-2}
      # --- Orígenes CORS permitidos (separados por coma). Vacío = cualquier origen local ---
      # ALLOWED_ORIGINS: http://192.168.1.20:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1);console.log('ok')}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
